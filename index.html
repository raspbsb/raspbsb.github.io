<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raspbsb Frontend Portfolio Sitemap" />
    <title>Raspbsb Portfolio</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="images/favicon_raspbsb_portfolio.svg" />
  </head>
  <body>
    <!-- 헤더 -->
    <header class="site-header">
      <h1>Raspbsb Portfolio</h1>

      <div class="site-header__actions">
        <a
          class="github-link"
          href="https://github.com/raspbsb/raspbsb.github.io"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub 저장소 열기"
        >
          <span class="material-icons" aria-hidden="true">code</span>
          <span>GitHub</span>
        </a>
        <button class="theme-toggle" aria-label="다크모드 전환">
          <span class="material-icons">dark_mode</span>
        </button>
      </div>
    </header>

    <section class="project-section">
      <ul class="project-list" id="projectList"></ul>
    </section>

    <script type="module" src="./js/main.js"></script>

    <!-- 푸터 -->
    <footer class="footer" id="contact">
      <div class="footer__inner">
        <section class="footer__section footer__profile" aria-labelledby="footer-profile-title">
          <h2 id="footer-profile-title" class="footer__title">Contact</h2>

          <p class="footer__name">배정호</p>
          <p class="footer__role">Frontend Developer / Web Publisher</p>
        </section>

        <address class="footer__section footer__contact">
          <ul class="footer__list">
            <li class="footer__item">
              <span class="footer__label">Email</span>
              <a href="mailto:unionbjh@naver.com" class="footer__link"> unionbjh@naver.com </a>
            </li>

            <li class="footer__item">
              <span class="footer__label">GitHub</span>
              <a
                href="https://github.com/raspbsb"
                class="footer__link"
                target="_blank"
                rel="noopener noreferrer"
              >
                github.com/raspbsb
              </a>
            </li>
          </ul>
        </address>
      </div>

      <div class="footer__bottom">
        <p class="footer__copyright">© 2026 배정호. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
